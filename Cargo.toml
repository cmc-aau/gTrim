[package]
name = "gtrim"
version = "0.2.0"
edition = "2024"
authors = ["Donovan Parks"]
description = "Toolkit for pruning multiple sequence alignments."

[dependencies]
anstyle = "1.0.*"
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "color"] }
csv = "1.4.0"
log = "0.4"
log4rs = "1.3"
ndarray = "0.17"
needletail = "0.6.3"
rand = "0.9.2"
rand_chacha = "0.9"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
indicatif = { version = "0.18", features = ["improved_unicode"] }
gzp = "2.0.1"
resvg = "0.48.1"

[dev-dependencies]
assert_cmd = "2.1.1"
tempfile = "3.23.0"
flate2 = "1.0"
