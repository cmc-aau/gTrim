# Builds the Sphinx documentation and pushes it to the gh_pages branch, which is
# served by GitHub Pages. Runs when main is pushed to.
name: Documentation update
on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Checkout the main branch (docs will be built from this)
      - uses: actions/checkout@v4
        with:
          path: main

      # Checkout the documentation branch (docs will be pushed to this)
      - uses: actions/checkout@v4
        with:
          ref: gh_pages
          path: gh_pages

      - name: Install Sphinx requirements
        working-directory: ${{ github.workspace }}/main/docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build documentation
        working-directory: ${{ github.workspace }}/main/docs
        run: make html SPHINXOPTS="-W --keep-going"

      - name: Move documentation
        run: |
          touch main/docs/build/html/.nojekyll
          cp -a main/docs/build/html/. gh_pages/

      - name: Upload documentation
        working-directory: ${{ github.workspace }}/gh_pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add --all
          git diff-index --quiet HEAD || git commit -m "docs update" -a
          git push
